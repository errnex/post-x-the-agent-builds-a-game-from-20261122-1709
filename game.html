<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DODGE! — a tiny game built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b12; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex;
    flex-direction: column; align-items: center; justify-content: center; }
  #hud { width: min(92vw, 540px); display: flex; justify-content: space-between;
    align-items: baseline; color: #f2f2f7; margin-bottom: 10px; }
  #hud h1 { font-size: 28px; letter-spacing: 4px; margin: 0; }
  #hud h1 span { color: #ff2e88; }
  #score { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #score small { display: block; font-size: 11px; letter-spacing: 3px; color: #8a8a99;
    text-align: right; font-weight: 600; }
  canvas { width: min(92vw, 540px); aspect-ratio: 9 / 16; max-height: 78vh;
    background: #11111c; border: 2px solid #26263a; border-radius: 14px;
    touch-action: none; display: block; }
  #hint { color: #8a8a99; font-size: 14px; margin-top: 12px; text-align: center; }
  #hint b { color: #c9c9d6; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <h1>DODGE<span>!</span></h1>
    <div id="score"><small>SCORE</small><span id="scoreNum">0</span></div>
  </div>
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint"><b>← →</b> or <b>drag</b> to dodge the falling blocks.<br>One prompt. One agent. One game.</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreNum');
  const W = 540, H = 960;

  const player = { x: W / 2, y: H - 110, w: 56, h: 56, speed: 9 };
  let blocks = [], keys = {}, score = 0, best = 0, over = false;
  let spawnIn = 0, elapsed = 0, last = performance.now();

  function spawn() {
    const w = 40 + Math.random() * 70;
    blocks.push({
      x: Math.random() * (W - w), y: -60, w, h: 34 + Math.random() * 40,
      vy: 3.4 + Math.random() * 2.2 + Math.min(3.5, elapsed / 9000),
      hue: 335 + Math.random() * 30
    });
  }

  function reset() {
    blocks = []; score = 0; elapsed = 0; over = false;
    player.x = W / 2; spawnIn = 0; last = performance.now();
    scoreEl.textContent = '0';
  }

  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function step(now) {
    const dt = Math.min(50, now - last); last = now;
    if (!over) {
      elapsed += dt;
      score = Math.floor(elapsed / 250);
      scoreEl.textContent = String(score);
      if (keys.ArrowLeft || keys.a) player.x -= player.speed;
      if (keys.ArrowRight || keys.d) player.x += player.speed;
      player.x = Math.max(0, Math.min(W - player.w, player.x));
      spawnIn -= dt;
      if (spawnIn <= 0) { spawn(); spawnIn = Math.max(240, 620 - elapsed / 40); }
      for (const b of blocks) b.y += b.vy * (dt / 16.7);
      blocks = blocks.filter(b => b.y < H + 80);
      for (const b of blocks) if (hit(player, b)) { over = true; best = Math.max(best, score); }
    }
    draw();
    requestAnimationFrame(step);
  }

  function draw() {
    ctx.fillStyle = '#11111c';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#1d1d2e'; ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (const b of blocks) {
      ctx.fillStyle = `hsl(${b.hue} 90% 58%)`;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(b.x, b.y, b.w, 6);
    }
    ctx.fillStyle = '#22d3ee';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(player.x, player.y, player.w, 8);
    if (over) {
      ctx.fillStyle = 'rgba(5,5,12,0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f2f2f7'; ctx.textAlign = 'center';
      ctx.font = '800 64px system-ui, sans-serif';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
      ctx.font = '600 34px system-ui, sans-serif';
      ctx.fillStyle = '#22d3ee';
      ctx.fillText('SCORE ' + score, W / 2, H / 2 + 30);
      ctx.fillStyle = '#8a8a99'; ctx.font = '500 24px system-ui, sans-serif';
      ctx.fillText('best ' + best + ' — press R to run it back', W / 2, H / 2 + 80);
    }
  }

  addEventListener('keydown', e => {
    keys[e.key] = true;
    if ((e.key === 'r' || e.key === 'R') && over) reset();
    if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  let dragX = null;
  canvas.addEventListener('pointerdown', e => { dragX = e.clientX; });
  addEventListener('pointermove', e => {
    if (dragX === null || over) return;
    const r = canvas.getBoundingClientRect();
    player.x += (e.clientX - dragX) * (W / r.width);
    player.x = Math.max(0, Math.min(W - player.w, player.x));
    dragX = e.clientX;
  });
  addEventListener('pointerup', () => { dragX = null; });
  reset();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
